<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Enviar dinero</title>
</head>
<body>
  <div class="container mt-5" style="max-width: 500px;">
    <h2 class="text-center mb-4">Enviar Dinero</h2>

    <div id="mensaje" class="mb-3"></div>

    <div class="d-grid mb-3">
      <button class="btn btn-success" type="button" data-bs-toggle="collapse" data-bs-target="#formContactoCollapse" aria-expanded="false" aria-controls="formContactoCollapse">
        + Agregar nuevo contacto
      </button>
    </div>

    <div class="collapse mb-4" id="formContactoCollapse">
      <div class="card card-body shadow-sm">
        <h5 class="card-title mb-3">Nuevo Contacto</h5>
        <form id="formNuevoContacto">
          <div class="mb-2">
            <label for="newName" class="form-label small fw-bold">Nombre y Apellido:</label>
            <input type="text" class="form-control" id="newName" placeholder="Ej: Armando Mochas Segura" required>
          </div>
          <div class="mb-2">
            <label for="newCbu" class="form-label small fw-bold">Número de CBU / Cuenta:</label>
            <input type="text" class="form-control" id="newCbu" placeholder="Ej: 0123456789" required>
          </div>
          <div class="mb-2">
            <label for="newAlias" class="form-label small fw-bold">Alias:</label>
            <input type="text" class="form-control" id="newAlias" placeholder="Ej: juan.perez.pago" required>
          </div>
          <div class="mb-3">
            <label for="newBank" class="form-label small fw-bold">Nombre del Banco:</label>
            <input type="text" class="form-control" id="newBank" placeholder="Ej: Banco Estado" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary w-100">Guardar Contacto</button>
            <button type="button" id="btn-cancelar" class="btn btn-light border">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card p-3 mb-4">
      <h5 class="border-bottom pb-2 mb-3">Tus Contactos</h5>
      <div id="lista-contactos" class="d-flex flex-column gap-3">
        <p class="text-muted text-center small my-2">No tienes contactos guardados. Agrega uno arriba.</p>
      </div>
    </div>

    <div id="contenedor-envio" class="card p-3 mb-4 shadow-sm animate-fade-in" style="display: none;">
        <h5 class="border-bottom pb-2 mb-3">Monto de la Transferencia</h5>
        <div class="mb-3">
            <label for="montoEnviar" class="form-label small fw-bold">Cantidad a enviar (CLP):</label>
            <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control form-control-lg" id="montoEnviar" placeholder="Ej: 5000" min="1">
            </div>
        </div>
        <button type="button" id="btn-enviar-global" class="btn btn-primary w-100 btn-lg">Confirmar Enviar Dinero</button>
    </div>
    <a href="menu.html" class="btn btn-secondary w-100">Volver al Menú Principal</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script/sendmoney.js"></script>
</body>
</html>
