<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Wallet - Enviar Fondos</title>
  <link rel="stylesheet" href="assets/sendmoney.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  
</head>
<body class="bg-wallet-gradient d-flex align-items-center justify-content-center py-4">

  <div class="app-card p-4 shadow-lg text-white" id="sendmoney-container" style="display: none;">
    
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="d-flex align-items-center">
        <a href="menu.html" class="text-white-50 hover-white fs-4 me-3"><i class="bi bi-chevron-left"></i></a>
        <h3 class="fw-bold m-0 tracking-tight">Enviar Dinero</h3>
      </div>
      <i class="bi bi-send-check text-info fs-4"></i>
    </div>
    
    <div id="mensaje" class="mb-3 animate-fade-in"></div>

    <div class="mb-4 position-relative">
      <label for="inputBuscar" class="form-label small fw-semibold text-white-50">Buscar Contacto Destinatario:</label>
      <div class="input-group">
        <span class="input-group-text input-group-text-premium"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control form-control-premium" id="inputBuscar" placeholder="Escribe nombre o alias...">
      </div>
      <div id="autocomplete-suggestions" class="autocomplete-box position-absolute w-100 mt-1 d-none shadow-lg"></div>
    </div>

    <div class="d-grid mb-3">
      <button class="btn btn-outline-info rounded-pill fw-semibold btn-sm py-2" type="button" data-bs-toggle="collapse" data-bs-target="#formContactoCollapse" aria-expanded="false" aria-controls="formContactoCollapse">
        <i class="bi bi-person-plus-fill me-1"></i> + Agregar nuevo contacto
      </button>
    </div>

    <div class="collapse mb-4" id="formContactoCollapse">
      <div class="card card-body bg-dark bg-opacity-25 border border-white border-opacity-10 rounded-4 text-white p-3">
        <h6 class="fw-bold mb-3 text-info"><i class="bi bi-postcard me-1"></i> Registrar Datos de Cuenta</h6>
        <form id="formNuevoContacto">
          <div class="mb-2">
            <label for="newName" class="form-label small fw-semibold text-white-50 m-0">Nombre Completo:</label>
            <input type="text" class="form-control form-control-premium form-control-sm" id="newName" placeholder="Ej: Armando Mochas" required>
          </div>
          <div class="mb-2">
            <label for="newCbu" class="form-label small fw-semibold text-white-50 m-0">Número de Cuenta / CBU:</label>
            <input type="text" class="form-control form-control-premium form-control-sm" id="newCbu" placeholder="Solo números" required>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="newAlias" class="form-label small fw-semibold text-white-50 m-0">Alias:</label>
              <input type="text" class="form-control form-control-premium form-control-sm" id="newAlias" placeholder="Ej: armando.pago" required>
            </div>
            <div class="col-6">
              <label for="newBank" class="form-label small fw-semibold text-white-50 m-0">Institución Bancaria:</label>
              <input type="text" class="form-control form-control-premium form-control-sm" id="newBank" placeholder="Ej: Banco Estado" required>
            </div>
          </div>
          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-info btn-sm w-100 rounded-pill fw-bold text-white" style="background: linear-gradient(135deg, #0077b6, #00b4d8); border:none;">Guardar</button>
            <button type="button" id="btn-cancelar" class="btn btn-outline-secondary btn-sm rounded-pill text-white-50">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="mb-4">
      <p class="text-white-50 small fw-semibold text-uppercase tracking-wider mb-2">Selecciona un Destinatario</p>
      <div id="lista-contactos" class="d-flex flex-column gap-2" style="max-height: 200px; overflow-y: auto; padding-right: 4px;">
        </div>
    </div>

    <div id="contenedor-envio" class="card bg-white bg-opacity-10 border border-white border-opacity-10 p-3 mb-3 rounded-4 shadow-sm" style="display: none;">
        <h6 class="fw-bold mb-3 text-white d-flex align-items-center gap-2">
          <i class="bi bi-cash-coin text-success"></i> Configurar Importe
        </h6>
        <div class="mb-3">
            <label for="montoEnviar" class="form-label small fw-semibold text-white-50">Cantidad a transferir (CLP):</label>
            <div class="input-group input-group-lg">
                <span class="input-group-text input-group-text-premium fw-bold">$</span>
                <input type="number" class="form-control form-control-premium text-end fw-bold" id="montoEnviar" placeholder="0">
            </div>
        </div>
        <button type="button" id="btn-enviar-global" class="btn btn-success btn-lg w-100 rounded-pill fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" style="background: linear-gradient(135deg, #38b000, #70e000); border: none;">
          Enviar Dinero Seguro <i class="bi bi-shield-check"></i>
        </button>
    </div>

    <a href="menu.html" class="btn btn-outline-secondary btn-sm w-100 rounded-pill text-white-50 border-secondary border-opacity-50 py-2">
      <i class="bi bi-arrow-left-circle me-1"></i> Cancelar y Salir
    </a>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script/sendmoney.js"></script>
</body>
</html>
