<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alka-Wallet - Iniciar Sesión</title>
  <link rel="stylesheet" href="assets/login.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  
</head>
<body class="bg-wallet-gradient d-flex align-items-center justify-content-center">

  <div class="login-card p-4 shadow-lg text-white" id="login-container" style="display: none;">
    
    <div class="text-center my-4">
      <i class="bi bi-person-circle fs-1 text-info mb-2"></i>
      <h2 class="fw-bold tracking-tight">Banca Digital</h2>
      <p class="text-white-50 small">Ingresa tus credenciales para continuar</p>
    </div>
    
    <div id="mensaje" class="mb-3 animate-fade-in"></div>

    <form id="loginForm" class="mb-4">
      
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold text-white-50">Correo Electrónico:</label>
        <div class="input-group">
          <span class="input-group-text input-group-text-dark"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control form-control-dark" id="email" placeholder="nombre@correo.com" required>
        </div>
      </div>
      
      <div class="mb-4">
        <label for="password" class="form-label small fw-semibold text-white-50">Contraseña:</label>
        <div class="input-group">
          <span class="input-group-text input-group-text-dark"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control form-control-dark" id="password" placeholder="••••••••" required>
        </div>
      </div>
      
      <button type="submit" id="btn-submit-login" class="btn btn-info btn-lg w-100 rounded-pill fw-bold text-white shadow-sm py-2 d-flex align-items-center justify-content-center gap-2" style="background: linear-gradient(135deg, #0077b6, #00b4d8); border: none;">
        Ingresar Seguro <i class="bi bi-shield-lock small"></i>
      </button>
    </form>

    <div class="d-grid mb-2">
      <button class="btn btn-outline-warning btn-sm rounded-pill border-opacity-25 text-warning bg-warning bg-opacity-10 py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCredenciales" aria-expanded="false" aria-controls="collapseCredenciales">
        <i class="bi bi-key me-1"></i> Ver credenciales de desarrollo
      </button>
    </div>
    
    <div class="collapse" id="collapseCredenciales">
      <div class="card card-body bg-dark border-secondary border-opacity-50 text-white-50 p-3 mt-2 rounded-3">
        <div class="d-flex align-items-center gap-2 mb-2 text-warning small">
          <i class="bi bi-info-circle-fill"></i>
          <span class="fw-bold">Simulador de Acceso:</span>
        </div>
        <ul class="list-unstyled m-0 cl-size" style="font-size: 13px;">
          <li><strong class="text-white">Email:</strong> usuario@bootcamp.com</li>
          <li><strong class="text-white">Password:</strong> password123</li>
        </ul>
      </div>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script/login.js"></script>
</body>
</html>
