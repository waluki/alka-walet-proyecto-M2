<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alka-Wallet - Historial de Movimientos</title>
  <link rel="stylesheet" href="assets/transactions.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  
</head>
<body class="bg-wallet-gradient d-flex align-items-center justify-content-center py-4">

  <div class="app-card p-4 shadow-lg text-white" id="transactions-container" style="display: none;">
    
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="d-flex align-items-center">
        <a href="menu.html" class="text-white-50 hover-white fs-4 me-3"><i class="bi bi-chevron-left"></i></a>
        <h3 class="fw-bold m-0 tracking-tight">Movimientos</h3>
      </div>
      <i class="bi bi-arrow-down-up text-info fs-4"></i>
    </div>
    
    <div class="card bg-info bg-opacity-5 border border-white border-opacity-10 p-3 mb-3 rounded-4 shadow-sm">
      <form id="form-filtro">
        <label for="filtro-tipo" class="form-label small fw-semibold text-white-50 mb-2">Filtrar transacciones por categoría:</label>
        <select id="filtro-tipo" class="form-select form-select-premium rounded-3 small">
          <option value="todas">🔄 Todos los movimientos</option>
          <option value="deposito">📥 Depósitos Recibidos</option>
          <option value="transferencia">📤 Transferencias Enviadas</option>
          <!--<option value="compra">💳 Compras con Tarjeta</option>-->
        </select>
      </form>
    </div>

    <div class="card bg-dark bg-opacity-25 border border-white border-opacity-10 rounded-4 shadow-sm mb-4 overflow-hidden">
      <ul class="list-group list-group-flush bg-transparent" id="lista-movimientos" style="max-height: 280px; overflow-y: auto;">
         </ul>
    </div>

    <div class="d-flex justify-content-between align-items-center gap-2">
      <button id="btn-limpiar" class="btn btn-outline-danger btn-sm rounded-pill px-3 border-opacity-50 text-opacity-75">
        <i class="bi bi-trash3 me-1"></i> Limpiar Historial
      </button>
      <a href="menu.html" class="btn btn-info btn-sm rounded-pill px-4 fw-bold text-white shadow-sm" style="background: linear-gradient(135deg, #0077b6, #00b4d8); border: none;">
        <i class="bi bi-house-door me-1"></i> Panel Principal
      </a>
    </div>

  </div>
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script/transactions.js"></script>
</body>
</html>
