<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Últimos Movimientos</title>
</head>
<body>
  <div class="container mt-5" style="max-width: 500px;">
    <h2 class="text-center mb-4">Últimos Movimientos</h2>
    
    <div class="card p-3 mb-3 shadow-sm">
      <form id="form-filtro">
        <label for="filtro-tipo" class="form-label small fw-bold">Filtrar por tipo de movimiento:</label>
        <select id="filtro-tipo" class="form-select">
          <option value="todas">Todos los movimientos</option>
          <option value="deposito">Depósitos</option>
          <option value="transferencia">Transferencias enviadas</option>
          <option value="compra">Compras con tarjeta</option>
        </select>
      </form>
    </div>
    <div class="card shadow-sm mb-4">
      <ul class="list-group list-group-flush" id="lista-movimientos">
        </ul>
    </div>

    <div class="d-flex justify-content-between gap-2">
      <button id="btn-limpiar" class="btn btn-outline-danger btn-sm">Limpiar Historial</button>
      <a href="menu.html" class="btn btn-secondary">Volver al Menú Principal</a>
    </div>
  </div>

  <script src="script/transactions.js"></script>
</body>
</html>
