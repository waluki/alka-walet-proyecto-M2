<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Menu</title>
</head>
<body>
  <div class="container mt-5" style="max-width: 500px;">
    <h2 class="text-center mb-4">Menú Principal</h2>
    
    <div class="mb-4">
      <label for="saldo" class="form-label fw-bold">Saldo en la cuenta:</label>
      <input type="text" class="form-control form-control-lg text-center" id="saldo" value="$100.000 CLP" readonly>
    </div>

    <div id="mensaje-redireccion" class="text-center fw-bold text-primary mb-3" style="min-height: 24px;"></div>

    <div class="d-flex align-items-center justify-content-evenly gap-2">
      <button type="button" class="btn btn-danger w-100 btn-menu" data-pantalla="Depositar" data-url="deposit.html">Depositar</button>
      <button type="button" class="btn btn-primary w-100 btn-menu" data-pantalla="Enviar Dinero" data-url="sendmoney.html">Enviar Dinero</button>
      <button type="button" class="btn btn-warning w-100 btn-menu" data-pantalla="Últimos Movimientos" data-url="transactions.html">Últimos Movimientos</button>
    </div>
  </div>

  <script src="script/menu.js"></script>
</body>
</html>
