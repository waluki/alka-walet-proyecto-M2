<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Wallet - Panel Principal</title>
  <link rel="stylesheet" href="assets/menu.css">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  
</head>
<body class="bg-wallet-gradient d-flex flex-column justify-content-between min-vh-100">

  <!-- BARRA DE NAVEGACIÓN RESPONSIVE (Requerimiento de Barra Obligatoria) -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-premium sticky-top shadow-sm">
    <div class="container-fluid max-width-container" style="max-width: 450px;">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
        <i class="bi bi-wallet2 text-info"></i> Alke Wallet
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" style="font-size: 0.85rem;"></span>
      </button>
      <div class="collapse navbar-collapse mt-2 mt-lg-0" id="navbarNav">
        <ul class="navbar-nav ms-auto text-end small">
          <li class="nav-item d-flex justify-content-center align-items-center ">
            <a class="nav-link active" href="menu.html"><i class="bi bi-house-door me-1"></i>Inicio</a>
          </li>
          <li class="nav-item container-fluid d-flex justify-content-center align-items-center ">
            <a class="nav-link text-white-50" href="deposit.html"><i class="bi bi-box-arrow-in-down-right me-1"></i>Depositar</a>
          </li>
          <li class="nav-item d-flex justify-content-center align-items-center ">
            <a class="nav-link text-white-50" href="sendmoney.html"><i class="bi bi-arrow-up-right-circle me-1"></i>Enviar</a>
          </li>
          <li class="nav-item d-flex justify-content-center align-items-center ">
            <a class="nav-link text-white-50" href="transactions.html"><i class="bi bi-clock-history me-1"></i>Movimientos</a>
          </li>
          <li class="nav-item mt-2 mt-lg-0">
            <a class="btn btn-sm btn-outline-danger w-100 rounded-pill" href="login.html"><i class="bi bi-box-arrow-right me-1"></i>Salir</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenedor Principal del Panel de Control -->
  <div class="container d-flex align-items-center justify-content-center flex-grow-1 py-4">
    <div class="app-card p-4 shadow-lg text-white" id="menu-container" style="display: none;">
      
      <!-- Encabezado Perfil (Simula la parte superior de la imagen_2409c0.png) -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-2">
          <div class="avatar-circle">
            <i class="bi bi-person text-white fs-5"></i>
          </div>
          <div>
            <span class="text-white-50 small d-block">Hola de nuevo,</span>
            <strong class="text-white">Usuario Bootcamp</strong>
          </div>
        </div>
        <button class="btn btn-link text-white position-relative p-1">
          <i class="bi bi-bell fs-4"></i>
          <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
        </button>
      </div>

      <!-- Leyenda Dinámica de Redirección (Manejo con jQuery) -->
      <div id="mensaje-redireccion" class="text-center small text-info fw-bold mb-3" style="min-height: 20px;"></div>

      <!-- TARJETA DE RESUMEN FINANCIERO PRINCIPAL: Balance Total -->
      <div class="main-balance-card p-4 text-center text-white mb-4">
        <span class="text-white-50 small text-uppercase tracking-wider fw-semibold">Saldo Disponible</span>
        <h2 id="saldo-display" class="fw-bold display-6 my-1">$0 CLP</h2>
        <div class="d-flex justify-content-center align-items-center gap-1 text-white-50 small mt-2">
          <i class="bi bi-shield-check text-success-light" style="color: #69db7c;"></i> Cuenta Protegida Cifrada
        </div>
      </div>

      <!-- TARJETAS SECUNDARIAS DE RESUMEN FINANCIERO (Ingresos vs Egresos - Lección 5) -->
      <div class="row g-3 mb-4">
        <!-- Tarjeta Ingresos -->
        <div class="col-6">
          <div class="summary-card p-3 text-start">
            <div class="d-flex align-items-center gap-2 text-success mb-1 small fw-bold">
              <i class="bi bi-arrow-down-left-circle-fill fs-5"></i> Ingresos
            </div>
            <span id="resumen-ingresos" class="fw-bold text-white small">$0</span>
          </div>
        </div>
        <!-- Tarjeta Egresos -->
        <div class="col-6">
          <div class="summary-card p-3 text-start">
            <div class="d-flex align-items-center gap-2 text-danger mb-1 small fw-bold">
              <i class="bi bi-arrow-up-right-circle-fill fs-5"></i> Egresos
            </div>
            <span id="resumen-egresos" class="fw-bold text-white small">$0</span>
          </div>
        </div>
      </div>

      <!-- SECCIÓN ACCIONES RÁPIDAS: Distribución de botones limpios estilo Mockup -->
      <p class="text-white-200 small fw-semibold text-uppercase tracking-wider mb-2">Operaciones rápidas</p>
      <div class="row g-2">
        <div class="col-4">
          <button type="button" class="btn border-1 border-white w-100 btn-menu d-flex flex-column align-items-center gap-1 shadow-sm" data-pantalla="Depositar" data-url="deposit.html">
            <i class="bi bi-box-arrow-in-down-right fs-4 text-success"></i> Depositar
          </button>
        </div>
        <div class="col-4">
          <button type="button" class="btn border-1 border-white action-button-pill w-100 btn-menu d-flex flex-column align-items-center gap-1 shadow-sm" data-pantalla="Enviar Dinero" data-url="sendmoney.html">
            <i class="bi bi-send fs-4 text-primary"></i> Enviar
          </button>
        </div>
        <div class="col-4">
          <button type="button" class="btn border-1 border-white action-button-pill w-100 btn-menu d-flex flex-column align-items-center gap-1 shadow-sm" data-pantalla="Últimos Movimientos" data-url="transactions.html">
            <i class="bi bi-clock-history fs-4 text-warning"></i> Historial
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer Fijo de la App móvil -->
  <footer class="text-center py-2 text-white-50 bg-dark bg-opacity-20 border-top border-white border-opacity-5" style="font-size: 11px;">
    &copy; 2026 E-Wallet Admin Panel. Operaciones Seguras.
  </footer>

  <!-- Elementos JS Obligatorios -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script/menu.js"></script>
</body>
</html>
