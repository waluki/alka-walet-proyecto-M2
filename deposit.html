<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alka-Wallet - Depositar Fondos</title>
  <link rel="stylesheet" href="assets/deposit.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  
</head>
<body class="bg-wallet-gradient d-flex align-items-center justify-content-center">

  <div class="app-card p-4 shadow-lg text-white" id="deposit-container" style="display: none;">
    
    <div class="d-flex align-items-center mb-4">
      <a href="menu.html" class="text-white-50 hover-white fs-4 me-3"><i class="bi bi-chevron-left"></i></a>
      <h3 class="fw-bold m-0 tracking-tight">Depositar Dinero</h3>
    </div>
    
    <div id="mensaje" class="mb-3"></div>

    <div class="saldo-display-card p-4 text-center text-white mb-4">
      <span class="text-white-50 small text-uppercase fw-semibold tracking-wider">Saldo Disponible Actual</span>
      <h2 id="saldo-dinamico" class="fw-bold display-6 mt-1 mb-0">$0 CLP</h2>
    </div>

    <form id="depositForm" class="mb-3">
      <div class="mb-4">
        <label for="depositAmount" class="form-label small fw-semibold text-white-50">Monto del depósito (CLP):</label>
        <div class="input-group input-group-lg">
          <span class="input-group-text input-group-text-premium fw-bold">$</span>
          <input type="number" class="form-control form-control-premium text-end fw-bold" id="depositAmount" placeholder="0" min="1" required>
        </div>
        <div class="form-text text-white-50 small mt-2">Los fondos se acreditarán inmediatamente de forma segura.</div>
      </div>
      
      <button type="submit" id="btn-ejecutar-deposito" class="btn btn-success btn-lg w-100 rounded-pill fw-bold shadow-sm py-2 d-flex align-items-center justify-content-center gap-2" style="background: linear-gradient(135deg, #38b000, #70e000); border: none;">
        <i class="bi bi-box-arrow-in-down-right"></i> Confirmar Depósito
      </button>
    </form>
    
    <div id="wrapper-leyenda" class="mb-3"></div>
    
    <a href="menu.html" class="btn btn-outline-secondary btn-sm w-100 rounded-pill text-white-50 border-secondary border-opacity-50 py-2 mt-2">
      <i class="bi bi-x-circle me-1"></i> Cancelar Operación
    </a>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script/deposit.js"></script>
</body>
</html>
