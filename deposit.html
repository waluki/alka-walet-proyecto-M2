<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Depositar</title>
</head>
<body>
  <div class="container mt-5" style="max-width: 400px;">
    <h2 class="text-center mb-4">Depositar</h2>
    
    <div id="mensaje" class="mb-3"></div>

    <form id="depositForm">
      <div class="form-group mb-3">
        <label for="depositAmount" class="form-label fw-bold">Monto a depositar:</label>
        <input type="number" class="form-control form-control-lg" id="depositAmount" placeholder="Ingresa monto (Ej: 5000)" min="1" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Realizar depósito</button>
    </form>
    
    <a href="menu.html" class="btn btn-secondary w-100 mt-3">Volver al Menú Principal</a>
  </div>

  <script src="script/deposit.js"></script>
</body>
</html>
