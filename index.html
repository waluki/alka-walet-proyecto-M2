<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alka-Wallet - Bienvenido</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  
</head>
<body class="bg-wallet-gradient d-flex align-items-center justify-content-center">

  <div class="welcome-card p-4 text-center text-white shadow-lg" id="welcome-content" style="display: none;">
    
    <div class="mt-5 mb-4">
      <div class="mb-3">
        <i class="bi bi-wallet2 pulse-icon"></i>
      </div>
      <h1 class="fw-bold display-6 tracking-tight">Alka-Wallet</h1>
      <p class="text-white-50 small">Tu dinero, seguro y a un toque de distancia</p>
    </div>

    <div class="my-5 p-4 bg-white bg-opacity-10 rounded-4 border border-white border-opacity-10 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-shield-check text-info fs-4"></i>
          <span class="small fw-semibold">Operaciones Cifradas</span>
        </div>
        <span class="badge bg-success bg-opacity-25 text-success-light border border-success border-opacity-25 small" style="color: #69db7c;">Activo</span>
      </div>
      <p class="text-start small text-white-50 m-0">Accede a tus cuentas, realiza transferencias y revisa tus últimos movimientos en tiempo real con la mayor comodidad.</p>
    </div>

    <div class="mb-5 mt-auto">
      <button id="btn-iniciar-bienvenida" class="btn btn-light btn-lg w-100 rounded-pill fw-bold shadow-sm py-3 transition-all d-flex align-items-center justify-content-center gap-2 ">
        Iniciar Sesión <i class="bi bi-arrow-right-short fs-4"></i>
      </button>
    </div>

    <div class="mt-4">
      <p class="text-white-50 original-footer-size" style="font-size: 11px;">&copy; 2026 Sence. Todos los derechos reservados.</p>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script/welcome.js"></script>
</body>
</html>
